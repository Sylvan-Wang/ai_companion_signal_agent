    excluded: "X/Instagram/TikTok excluded due to API friction, noise, short-form context, and compliance complexity."

# ─────────────────────────────────────────────
# QUERY DESIGN RULES
# ─────────────────────────────────────────────
query_design_rules:
  - "For MVP, only implement Reddit data collection."
  - "Tag every collected item with: market_track, matched_keyword, source, subreddit."
  - "Use track-specific keyword groups — do not treat all keywords equally."
  - "If a track has no collected data in a run, report it under Missing Coverage."
  - "Do not over-index on Replika and CharacterAI — they represent only the AI companion app track."
  - "Use ai_office_hardware as an adjacent signal track for privacy, ambient recording, and physical AI interface signals."
  - "Emotional_need_adjacent content must never be framed as conversion or acquisition opportunity."

