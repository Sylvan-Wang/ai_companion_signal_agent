automation:
  schedule_frequency: "daily"
  run_time_utc: "17:00"
  timezone_note: "GitHub Actions runs in UTC. 17:00 UTC ≈ 09:00 PST / 10:00 PDT."
  manual_trigger: true
  output_frequency: "one_report_per_run"
  failure_notification: "github_actions_log_only"


