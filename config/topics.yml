# DATA COLLECTION PARAMETERS
collection:
  lookback_window: "24h"
  post_limit_per_run: 60
  comment_limit_per_post: 20
  minimum_comment_length: 120
  sort_by: "new"

# CLEANING RULES
cleaning:
  remove_duplicates: true
  remove_deleted_content: true
  remove_short_comments: true
  remove_bot_like_content: true
  remove_low_signal_reactions: true
  remove_off_topic_ai_debates: true
  keep:
    user_stories: true
    specific_complaints: true
    feature_requests: true
    product_comparisons: true
    purchase_concerns: true
    trust_and_privacy_mentions: true
